[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dataqualy"
version = "0.2.0"
description = "Validador de qualidade para migrações de dados"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pyspark==4.2.0",
    "PyYAML>=6.0,<7.0",
]

[project.scripts]
dataqualy = "dataqualy.cli:main"

[project.optional-dependencies]
jdbc = ["JPype1>=1.5,<2.0"]
dev = [
    "pytest>=8.0,<9.0",
]
build = [
    "pyinstaller>=6.0,<7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp"
markers = ["integration: bancos reais opcionais (variáveis DATAQUALY_INTEGRATION_*)"]
