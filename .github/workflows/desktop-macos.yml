name: Desktop macOS
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'pyproject.toml', 'dataqualy.spec', 'scripts/**', '.github/workflows/desktop-macos.yml']
  pull_request:
    paths: ['src/**', 'tests/**', 'pyproject.toml', 'dataqualy.spec', 'scripts/**', '.github/workflows/desktop-macos.yml']
jobs:
  desktop:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
      DATAQUALITY_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python -m pip install -e ".[dev,build,jdbc]"
      - run: python -m pytest -q
      - run: ./scripts/build-macos.sh --smoke-test
      - uses: actions/upload-artifact@v4
        with:
          name: dataquality-macos
          path: |
            dist/*.dmg
            build/macos-smoke/*.png
