name: Desktop Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'pyproject.toml', 'sincro.spec', 'scripts/**', '.github/workflows/desktop-windows.yml']
  pull_request:
    paths: ['src/**', 'tests/**', 'pyproject.toml', 'sincro.spec', 'scripts/**', '.github/workflows/desktop-windows.yml']
jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
      QT_QPA_FONTDIR: C:\Windows\Fonts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python -m pip install -e ".[dev,build,jdbc]"
      - run: python -m pytest -q
      - shell: pwsh
        run: .\scripts\build-executable.ps1 -SmokeTest
      - uses: actions/upload-artifact@v4
        with:
          name: sincro-windows
          path: |
            dist/sincro.exe
            build/desktop-smoke/*.png
