name: Release desktop

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
      SINCRO_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python -m pip install -e ".[dev,build,jdbc]"
      - run: python -m pytest -q
      - run: ./scripts/build-macos.sh --smoke-test
      - name: Prepare macOS installer
        run: |
          test "$(uname -m)" = "arm64"
          ditto -c -k --sequesterRsrc --keepParent dist/Sincro.app dist/Sincro-macOS-arm64.zip
          mv dist/Sincro-macos-arm64.dmg dist/Sincro-macOS-arm64.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: |
            dist/Sincro-macOS-arm64.dmg
            dist/Sincro-macOS-arm64.zip
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
      QT_QPA_FONTDIR: C:\Windows\Fonts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python -m pip install -e ".[dev,build,jdbc]"
      - run: python -m pytest -q
      - shell: pwsh
        run: .\scripts\build-executable.ps1 -SmokeTest
      - name: Prepare Windows downloads
        shell: pwsh
        run: |
          Copy-Item dist\sincro.exe dist\Sincro-Windows-x64.exe
          Compress-Archive -Path dist\Sincro-Windows-x64.exe -DestinationPath dist\Sincro-Windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            dist/Sincro-Windows-x64.exe
            dist/Sincro-Windows-x64.zip
          if-no-files-found: error

  publish:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Generate checksums
        run: cd release && sha256sum * > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes --title "Sincro $GITHUB_REF_NAME"
          fi
